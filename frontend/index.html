<!DOCTYPE html>
<html lang="fr">                                  <!-- racine de la page, contenu en français -->
<head>                                            <!-- infos invisibles : réglages, titre, CSS -->
  <meta charset="UTF-8">                          <!-- encodage : permet d'afficher les accents -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0"> <!-- adapte la page à la largeur du téléphone -->
  <title>Mercasport</title>                       <!-- titre affiché dans l'onglet du navigateur -->
  <link rel="stylesheet" href="css/style.css"> 
  <link rel="stylesheet" href="css/style-header.css"> <!-- CSS de normalisation : supprime les différences entre navigateurs -->
  <link rel="stylesheet" href="css/style-hero.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>                                            <!-- tout ce qui est visible dans la page -->

  <header>                                        <!-- en-tête : logo, navigation, accès au compte -->
    <!-- Emplacement du logo : le nom sert de repère tant que l'image n'est pas disponible. -->
    <a href="index.html" aria-label="Mercasport — Accueil">Mercasport</a>

    <nav aria-label="Navigation principale">       <!-- liens vers les rubriques du site -->
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="#ads-list">Offres</a></li>
        <!-- <li><a href="actualites.html">Actualités</a></li>
        <li><a href="contact.html">Contact</a></li> -->
      </ul>
    </nav>

    <div role="group" aria-label="Accès au compte"> <!-- actions séparées de la navigation centrale -->
      <a href="login.html" class="button-secondary">Se connecter</a>
      <a href="register.html" class="primary-button">S'inscrire</a>
    </div>
  </header>

  <div class="hero">
    <!-- Visuel décoratif derrière le contenu ; le filtre sombre est ajouté en CSS. -->
    <img src="img/hero.svg" alt="" class="hero-image">

    <section class="search" aria-labelledby="hero-title">
      <h1 id="hero-title">Bienvenue sur <span>Mercasport</span></h1>
      <h2>Démarrez votre carrière professionnelle ici</h2>
      <form action="#" method="get">              <!-- la recherche conserve son comportement actuel -->
        <div>                                     <!-- regroupe les trois champs sur une même ligne -->
          <input type="text" name="keywords" placeholder="Mot-clés" aria-label="Mot-clés">
          <input type="text" name="location" placeholder="Localisation" aria-label="Localisation">
          <input type="text" name="company" placeholder="Club" aria-label="Club">
        </div>
        <button type="submit">Rechercher</button>
      </form>
    </section>
  </div>

  <section class="job-listings">                  <!-- zone des offres -->
    <h2>Dernières offres</h2>
    <ul id="ads-list"></ul>                       <!-- liste VIDE : le JS y crée une carte par offre.
                                                       Son id doit être identique à getElementById("ads-list") -->
  </section>

  <dialog id="ads-detail">                        <!-- la modale, cachée par défaut.
                                                       JS : getElementById("ads-detail"), showModal() / close() -->
    <div class="ads-inner">

        <button id="x-detail" aria-label="Fermer la fenêtre">&#10005;</button>
                                                  <!-- la croix. &#10005; = symbole ✕ ;
                                                       aria-label = texte lu par les lecteurs d'écran ;
                                                       JS : getElementById("x-detail"). Hors de la div ci-dessous,
                                                       donc elle n'est jamais effacée -->
        <div id="ads-content"></div>                  <!-- zone de contenu : JS la vide et la remplit à chaque clic.
                                                       JS : getElementById("ads-content") -->
    </div>
  </dialog>

  <footer>                                        <!-- pied de page -->
    <p>© 2026 MERCASPORT</p>
  </footer>

  <script type="module" src="js/app.mjs"></script>               <!-- charge le JS EN DERNIER : les éléments ci-dessus existent déjà -->
</body>
</html>
